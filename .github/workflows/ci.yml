name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check local test attestation
        id: attest
        run: |
          if node scripts/attest.mjs --verify; then
            echo "attested=true" >> "$GITHUB_OUTPUT"
          else
            echo "attested=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.attest.outputs.attested != 'true'
        run: npm ci
      - name: Typecheck
        if: steps.attest.outputs.attested != 'true'
        run: npm run typecheck
      - name: Unit tests
        if: steps.attest.outputs.attested != 'true'
        run: npm test
      - name: End-to-end tests
        if: steps.attest.outputs.attested != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Skipping e2e: no CLOUDFLARE_API_TOKEN secret (wrangler dev needs Cloudflare access for bindings)."
            exit 0
          fi
          npx playwright install --with-deps chromium
          npm run test:e2e
